<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator - CodeAlpha Task 2</title>
<style>
body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#1a1a2e;margin:0;font-family:Arial}
.calc{background:#16213e;padding:20px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.5);width:300px}
#display{width:100%;height:60px;font-size:32px;text-align:right;border:none;background:#0f3460;color:white;border-radius:10px;padding:10px;box-sizing:border-box;margin-bottom:15px}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{height:60px;font-size:20px;border:none;border-radius:10px;cursor:pointer;background:#e94560;color:white;font-weight:bold}
button.operator{background:#0f3460}
button.equal{background:#533483;grid-column:span 2}
button.clear{background:#ff5e5e}
button:active{transform:scale(0.95)}
h3{text-align:center;color:white;margin-top:0}
</style>
</head>
<body>
<div class="calc">
<h3>CodeAlpha Calculator</h3>
<input type="text" id="display" disabled>
<div class="buttons">
<button class="clear" onclick="clearDisplay()">C</button>
<button class="operator" onclick="append('%')">%</button>
<button class="operator" onclick="back()">⌫</button>
<button class="operator" onclick="append('/')">/</button>

<button onclick="append('7')">7</button>
<button onclick="append('8')">8</button>
<button onclick="append('9')">9</button>
<button class="operator" onclick="append('*')">×</button>

<button onclick="append('4')">4</button>
<button onclick="append('5')">5</button>
<button onclick="append('6')">6</button>
<button class="operator" onclick="append('-')">-</button>

<button onclick="append('1')">1</button>
<button onclick="append('2')">2</button>
<button onclick="append('3')">3</button>
<button class="operator" onclick="append('+')">+</button>

<button onclick="append('0')">0</button>
<button onclick="append('.')">.</button>
<button class="equal" onclick="calculate()">=</button>
</div>
<p style="text-align:center;color:#aaa;font-size:12px;margin-top:15px">Poonam Bora - Task 2</p>
</div>
<script>
let display=document.getElementById('display');
function append(v){display.value+=v}
function clearDisplay(){display.value=''}
function back(){display.value=display.value.slice(0,-1)}
function calculate(){
 try{display.value=eval(display.value)}
 catch{display.value='Error'}
}
</script>
</body>
</html>
